<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Python-Lernpfad – Interaktiver Kurs</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700&family=JetBrains+Mono:wght@400;600&family=Figtree:wght@400;600&display=swap">
<style>
:root{--bg:#f3f6fa;--surface:#fff;--ink:#14213d;--muted:#5b6678;--line:#d6dde8;--blue:#306998;--onblue:#fff;--yellow:#ffd43b;--ok:#1d7a46;--okbg:#e2f4ea;--bad:#b3261e;--badbg:#fbe7e5;--code:#14213d;--codeink:#e8eefc;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1626;--surface:#17233a;--ink:#e8eefc;--muted:#9aa8c2;--line:#2b3a57;--blue:#6ea8dc;--onblue:#0e1626;--ok:#6fdc9f;--okbg:#14352a;--bad:#ff9a92;--badbg:#3b1d1d;--code:#0a111f}}
:root[data-theme="dark"]{--bg:#0e1626;--surface:#17233a;--ink:#e8eefc;--muted:#9aa8c2;--line:#2b3a57;--blue:#6ea8dc;--onblue:#0e1626;--ok:#6fdc9f;--okbg:#14352a;--bad:#ff9a92;--badbg:#3b1d1d;--code:#0a111f}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 17px/1.55 Figtree,system-ui,sans-serif}
h1,h2,h3{font-family:"Bricolage Grotesque",Figtree,sans-serif;line-height:1.15;margin:0}
.wrap{max-width:1040px;margin:0 auto;padding:20px 16px 60px}
h1{font-size:clamp(28px,5vw,40px)}
.sub{color:var(--muted);margin:4px 0 16px}
.bar{height:10px;background:var(--line);border-radius:6px;overflow:hidden;max-width:360px}
.bar i{display:block;height:100%;width:0;background:var(--yellow);transition:width .4s}
.layout{display:grid;grid-template-columns:230px 1fr;gap:20px;margin-top:16px}
@media(max-width:760px){.layout{grid-template-columns:1fr}}
#path{display:flex;flex-direction:column;gap:6px}
@media(max-width:760px){#path{flex-direction:row;overflow-x:auto;padding-bottom:6px}}
#path button{flex:0 0 auto;text-align:left;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);padding:9px 12px;border-radius:10px;font:600 15px Figtree,sans-serif;cursor:pointer;display:flex;gap:8px;align-items:center}
#path button[aria-current="true"]{border-color:var(--blue);box-shadow:inset 4px 0 0 var(--yellow)}
#path .st{margin-left:auto;color:var(--ok)}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.card{background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:20px;margin-bottom:16px}
.card h2{font-size:26px;margin-bottom:8px}
.card h3{font-size:18px;margin:0 0 6px}
pre{margin:12px 0;background:var(--code);color:var(--codeink);border-radius:10px;padding:14px 16px;font:400 15px/1.6 "JetBrains Mono",ui-monospace,monospace;overflow-x:auto;white-space:pre-wrap}
code{font-family:"JetBrains Mono",monospace;font-size:.92em;background:var(--bg);padding:1px 6px;border-radius:5px}
textarea{width:100%;min-height:190px;resize:vertical;background:var(--code);color:var(--codeink);border:2px solid var(--line);border-radius:10px;padding:14px;font:400 15px/1.6 "JetBrains Mono",ui-monospace,monospace;tab-size:4}
textarea:focus{border-color:var(--blue);outline:none}
.row{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0}
.btn{border:0;background:var(--blue);color:var(--onblue);padding:10px 18px;border-radius:10px;font:600 16px Figtree,sans-serif;cursor:pointer}
.btn.alt{background:transparent;color:var(--blue);border:1.5px solid var(--blue)}
.btn:disabled{opacity:.5;cursor:default}
.res{margin-top:10px;display:grid;gap:8px}
.t{padding:10px 14px;border-radius:10px;font-size:15px}
.t.ok{background:var(--okbg);color:var(--ok)}
.t.no{background:var(--badbg);color:var(--bad)}
.t small{display:block;font:400 14px "JetBrains Mono",monospace;white-space:pre-wrap;margin-top:4px}
.note{padding:10px 14px;border-left:4px solid var(--yellow);background:var(--bg);border-radius:6px;margin-top:10px;font-size:15px}
.lbl{color:var(--muted);font-size:14px;margin:12px 0 0}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.topline{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-top:12px}
.progress-area{flex:1;min-width:220px}
.muted{color:var(--muted)}
.gamification{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.stat{display:inline-flex;gap:5px;align-items:center;background:var(--surface);border:1px solid var(--line);padding:7px 11px;border-radius:9px;font-size:14px;color:var(--muted)}
.stat strong{color:var(--ink);font-size:16px}
.btn.small{font-size:13px;padding:7px 10px}
.input-label{display:block;margin:14px 0 5px;font-size:14px;font-weight:600}
.input-label span{font-weight:400;color:var(--muted)}
textarea.stdin{min-height:72px;height:72px;background:var(--bg);color:var(--ink);font:14px/1.5 "JetBrains Mono",monospace}
.lesson-meta{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 0}
.pill{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:4px 9px;color:var(--muted);font-size:12px}
.card .lead{color:var(--muted);font-size:14px;margin:0 0 8px}
.feedback-title{font-weight:700;margin-bottom:5px}
.achievement{padding:10px 12px;border:1px solid var(--line);background:var(--bg);border-radius:10px;margin-top:8px}
#path button{width:100%}
#path button .num{color:var(--muted);font-variant-numeric:tabular-nums}
#path button[aria-current="true"]{background:var(--surface)}
#out{scroll-margin-top:16px}
button:focus-visible,textarea:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
#path button:disabled{opacity:.55}
@media(max-width:760px){.gamification{width:100%}.progress-area{width:100%}#path button{width:auto}}

</style>
</head>
<body>
<div class="wrap">
<h1>Python-Lernpfad</h1>
<p class="sub">Lerne Schritt für Schritt Python: Lies die Erklärung, probiere Code aus und überprüfe deine Lösungen selbstständig.</p>
<div class="topline">
  <div class="progress-area">
    <div class="bar"><i id="tbar"></i></div>
    <small id="ttxt" class="muted"></small>
  </div>
  <div class="gamification">
    <span class="stat"><strong id="xp">0</strong> XP</span>
    <span class="stat"><strong id="level">1</strong> Level</span>
    <button class="btn alt small" id="resetAll" type="button">Fortschritt zurücksetzen</button>
  </div>
</div>
<div class="layout"><nav id="path" aria-label="Lernpfad"></nav><main id="main"></main></div>
</div>
<p id="storageNotice" class="muted" style="font-size:12px;margin-top:10px" aria-live="polite"></p>
<script>
const S=[
{t:"Ausgabe",h:`<p>Mit <code>print()</code> gibt Python Text auf dem Bildschirm aus. Text steht immer in Anführungszeichen.</p><pre>print("Guten Morgen")</pre>`,
task:"Gib den Text „Hallo Welt“ aus.",start:"# Schreibe deinen Code hier\n",
tests:[{out:"Hallo Welt"}],need:[],ban:[],
hints:["Benutze die Funktion print().","Der Text gehört in Anführungszeichen innerhalb der Klammern.",'Die Lösung beginnt so: print("Hallo …")'],sol:'print("Hallo Welt")'},
{t:"Variablen",h:`<p>Eine Variable speichert einen Wert unter einem Namen. Mit ihr kannst du rechnen.</p><pre>alter = 14\nprint(alter + 1)   # gibt 15 aus</pre>`,
task:"Lege eine Variable preis mit dem Wert 4 an. Gib den Gesamtpreis für 3 Stück aus (preis mal 3).",start:"",
tests:[{out:"12"}],need:[{re:/preis\s*=\s*4/,msg:"Lege die Variable mit preis = 4 an."},{re:/preis\s*\*\s*3|3\s*\*\s*preis/,msg:"Rechne mit der Variable: preis * 3."}],ban:[],
hints:["Zuweisung: preis = 4","Multiplikation schreibst du mit *.","print(preis * 3)"],sol:"preis = 4\nprint(preis * 3)"},
{t:"Eingabe",usesInput:true,h:`<p>Mit <code>input()</code> liest dein Programm eine Eingabe ein. Das Ergebnis ist immer Text. Mit <code>int()</code> wird daraus eine Zahl. In <code>print()</code> kannst du mehrere Teile mit einem Beistrich trennen – Python setzt automatisch ein Leerzeichen dazwischen. Willst du kein Leerzeichen, hängst du Texte mit <code>+</code> zusammen.</p><pre>name = input()\nprint("Hi", name)      # Hi Mia\nprint("Hi " + name)    # Hi Mia</pre>`,
task:"Lies einen Namen mit input() ein und gib „Hallo, Name!“ aus. Bei der Eingabe Mia soll Hallo, Mia! erscheinen.",start:"",
tests:[{inp:["Mia"],out:"Hallo, Mia!"},{inp:["Ben"],out:"Hallo, Ben!"}],need:[{re:/\binput\s*\(/,msg:"Lies den Namen mit input() ein."}],ban:[],
hints:["Speichere die Eingabe zuerst in einer Variable: name = input()",'Mit einem Beistrich setzt Python ein Leerzeichen vor das Rufzeichen. Verbinde die Teile stattdessen mit +.','print("Hallo, " + name + "!")'],sol:'name = input()\nprint("Hallo, " + name + "!")'},
{t:"Verzweigung",usesInput:true,h:`<p>Mit <code>if</code> und <code>else</code> wählt dein Programm einen Weg. Der Doppelpunkt und die Einrückung (4 Leerzeichen) sind wichtig. Der Rest einer Division steht in <code>%</code>.</p><pre>if 7 % 2 == 1:\n    print("Rest 1")\nelse:\n    print("kein Rest")</pre>`,
task:"Lies eine ganze Zahl ein. Gib „gerade“ aus, wenn sie durch 2 teilbar ist, sonst „ungerade“.",start:"",
tests:[{inp:["4"],out:"gerade"},{inp:["7"],out:"ungerade"},{inp:["0"],out:"gerade"}],need:[{re:/\binput\s*\(/,msg:"Lies die Zahl mit int(input()) ein."},{re:/\bif\b/,msg:"Benutze eine if-Verzweigung."}],ban:[],
hints:["Lies zuerst eine ganze Zahl ein: zahl = int(input())","Eine Zahl ist gerade, wenn zahl % 2 gleich 0 ist.","Vergleiche mit ==, nicht mit =.",'if zahl % 2 == 0:\n    print("gerade")'],sol:'zahl = int(input())\nif zahl % 2 == 0:\n    print("gerade")\nelse:\n    print("ungerade")'},
{t:"for-Schleife",h:`<p>Eine <code>for</code>-Schleife wiederholt Code. <code>range(1, 4)</code> liefert 1, 2, 3 (das Ende zählt nicht mit).</p><pre>for i in range(1, 4):\n    print(i)</pre>`,
task:"Gib die Zahlen von 1 bis 5 aus, jede in einer eigenen Zeile.",start:"",
tests:[{out:"1\n2\n3\n4\n5"}],need:[{re:/\bfor\b/,msg:"Benutze eine for-Schleife."}],ban:[],
hints:["range(1, 6) liefert 1 bis 5.","Der Schleifenkörper ist eingerückt.","for i in range(1, 6):\n    print(i)"],sol:"for i in range(1, 6):\n    print(i)"},
{t:"Summe (while-Schleife)",usesInput:true,h:`<p>Eine <code>while</code>-Schleife läuft so lange, wie eine Bedingung wahr ist. Sie eignet sich besonders gut, wenn man einen Zähler schrittweise erhöht und dabei ein Ergebnis in einer Variable aufsammelt.</p><pre>s = 0\ni = 1\nwhile i <= 3:\n    s = s + i\n    i = i + 1\nprint(s)   # 6</pre>`,
task:"Lies eine Zahl n ein. Berechne die Summe 1 + 2 + … + n mit einer <code>while</code>-Schleife und gib sie aus.",start:"",
tests:[{inp:["4"],out:"10"},{inp:["10"],out:"55"},{inp:["1"],out:"1"}],need:[{re:/\binput\s*\(/,msg:"Lies die Zahl n mit int(input()) ein."},{re:/\bwhile\b/,msg:"Benutze eine while-Schleife."}],ban:[],
hints:["Lies zuerst n ein: n = int(input())","Starte mit summe = 0 und einem Zähler i = 1.","Die Schleife läuft, solange i <= n gilt. Vergiss nicht, i in der Schleife um 1 zu erhöhen (i = i + 1).","summe = summe + i\ni = i + 1"],sol:"n = int(input())\nsumme = 0\ni = 1\nwhile i <= n:\n    summe = summe + i\n    i = i + 1\nprint(summe)"},
{t:"Listen",h:`<p>Eine Liste hält mehrere Werte. <code>append()</code> hängt etwas an, <code>len()</code> zählt die Elemente, <code>liste[-1]</code> ist das letzte Element.</p><pre>z = [1, 2]\nz.append(3)\nprint(len(z))   # 3</pre>`,
task:"Füge der Liste die Zahl 10 hinzu. Gib dann die Länge der Liste und danach ihr letztes Element aus (je eine Zeile).",start:"zahlen = [3, 8, 1, 9, 4]\n",
tests:[{out:"6\n10"}],need:[{re:/append\s*\(/,msg:"Benutze append()."}],ban:[],
hints:["zahlen.append(10)","Die Länge erhältst du mit len(zahlen).","Das letzte Element ist zahlen[-1]."],sol:"zahlen = [3, 8, 1, 9, 4]\nzahlen.append(10)\nprint(len(zahlen))\nprint(zahlen[-1])"},
{t:"Funktionen",h:`<p>Eine Funktion wird mit <code>def</code> definiert und gibt mit <code>return</code> ein Ergebnis zurück. Das Programm testet sie anschließend mit eigenen Werten.</p><pre>def doppelt(n):\n    return n * 2</pre>`,
task:"Schreibe eine Funktion quadrat(n), die n mal n zurückgibt.",start:"def quadrat(n):\n    # dein Code\n",
tests:[{call:"print(quadrat(3))",out:"9",d:"quadrat(3)"},{call:"print(quadrat(-4))",out:"16",d:"quadrat(-4)"},{call:"print(quadrat(0))",out:"0",d:"quadrat(0)"}],need:[{re:/def\s+quadrat\s*\(/,msg:"Die Funktion muss quadrat heißen."}],ban:[],
hints:["Die Funktion braucht ein return.","return n * n","Prüfe die Einrückung der return-Zeile."],sol:"def quadrat(n):\n    return n * n"},
{t:"Listen & Funktionen",h:`<p>Funktionen können Listen als Parameter bekommen und sie mit einer Schleife durchgehen.</p><pre>def anzahl_positiv(liste):\n    c = 0\n    for x in liste:\n        if x > 0:\n            c = c + 1\n    return c</pre>`,
task:"Schreibe maximum(liste), die die größte Zahl der Liste zurückgibt. Die eingebaute Funktion max() ist verboten.",start:"def maximum(liste):\n    # dein Code\n",
tests:[{call:"print(maximum([3, 8, 1]))",out:"8",d:"maximum([3, 8, 1])"},{call:"print(maximum([-5, -2, -9]))",out:"-2",d:"maximum([-5, -2, -9])"},{call:"print(maximum([7]))",out:"7",d:"maximum([7])"}],need:[{re:/def\s+maximum/,msg:"Die Funktion muss maximum heißen."}],ban:[{re:/\bmax\s*\(/,msg:"Die Funktion max() ist hier nicht erlaubt."}],
hints:["Merke dir das bisher größte Element in einer Variable.","Starte mit dem ersten Element: liste[0].","Gehe mit for x in liste: durch und ersetze, wenn x größer ist."],sol:"def maximum(liste):\n    gr = liste[0]\n    for x in liste:\n        if x > gr:\n            gr = x\n    return gr"},
{t:"Abschluss",h:`<p>Zum Schluss ein Klassiker. Kombiniere Verzweigungen, Rest-Rechnung und Funktionen. Prüfe zuerst den speziellsten Fall.</p>`,
task:"Schreibe fizzbuzz(n). Sie gibt „FizzBuzz“ zurück, wenn n durch 15 teilbar ist, „Fizz“ bei Teilbarkeit durch 3, „Buzz“ bei 5, sonst die Zahl als Text (str(n)).",start:"def fizzbuzz(n):\n    # dein Code\n",
tests:[{call:"print(fizzbuzz(15))",out:"FizzBuzz",d:"fizzbuzz(15)"},{call:"print(fizzbuzz(9))",out:"Fizz",d:"fizzbuzz(9)"},{call:"print(fizzbuzz(10))",out:"Buzz",d:"fizzbuzz(10)"},{call:"print(fizzbuzz(7))",out:"7",d:"fizzbuzz(7)"}],need:[{re:/def\s+fizzbuzz/,msg:"Die Funktion muss fizzbuzz heißen."}],ban:[],
hints:["Prüfe zuerst n % 15 == 0, danach 3 und 5.","Benutze if, elif und else.",'Am Ende: return str(n)'],sol:'def fizzbuzz(n):\n    if n % 15 == 0:\n        return "FizzBuzz"\n    elif n % 3 == 0:\n        return "Fizz"\n    elif n % 5 == 0:\n        return "Buzz"\n    else:\n        return str(n)'}
];
const SRC=[["https://cdn.jsdelivr.net/npm/skulpt@1.2.0/dist/skulpt.min.js","https://cdn.jsdelivr.net/npm/skulpt@1.2.0/dist/skulpt-stdlib.js"],["https://cdn.jsdelivr.net/npm/@s524797336/skulpt@1.0.3/skulpt.min.js","https://cdn.jsdelivr.net/npm/@s524797336/skulpt@1.0.3/skulpt-stdlib.js"]];
const ld=u=>new Promise(r=>{const s=document.createElement("script");s.src=u;s.onload=()=>r(true);s.onerror=()=>r(false);document.head.appendChild(s)});
let skp=null;
function ensure(){if(!skp)skp=(async()=>{if(window.Sk&&Sk.builtinFiles)return true;for(const [a,b] of SRC){if(await ld(a)&&await ld(b)&&window.Sk&&Sk.builtinFiles)return true}return false})().then(ok=>{if(!ok)skp=null;return ok});return skp}
let cur=0,D={code:{},done:{},xp:0,awards:[]},hn={},fails={};
try{
  const saved=JSON.parse(localStorage.getItem("pylp")||"{}");
  if(saved&&typeof saved==="object"){
    D.code=saved.code&&typeof saved.code==="object"?saved.code:{};
    D.stdin=saved.stdin&&typeof saved.stdin==="object"?saved.stdin:{};
    D.done=saved.done&&typeof saved.done==="object"?saved.done:{};
    D.xp=Number.isFinite(saved.xp)?Math.max(0,saved.xp):0;
    D.awards=Array.isArray(saved.awards)?saved.awards:[];
  }
}catch(e){}
const save=()=>{try{localStorage.setItem("pylp",JSON.stringify(D))}catch(e){showStorageWarning()}};
const $=s=>document.querySelector(s);
function showStorageWarning(){
  const box=$("#storageNotice");
  if(box)box.textContent="Hinweis: Dein Browser konnte den Lernstand nicht speichern. Verwende möglichst keinen privaten Modus.";
}

const esc=s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const rd=x=>{if(!Sk.builtinFiles||!Sk.builtinFiles.files[x])throw"File not found: '"+x+"'";return Sk.builtinFiles.files[x]};
async function run(code,inp){let out="";Sk.configure({output:t=>{out+=t},read:rd,inputfun:()=>inp&&inp.length?inp.shift():"",inputfunTakesPrompt:false,__future__:Sk.python3,execLimit:4000});
try{await Sk.misceval.asyncToPromise(()=>Sk.importMainWithBody("<stdin>",false,code,true));return{out}}catch(e){return{out,err:e.toString()}}}
const norm=s=>s.replace(/\r/g,"").split("\n").map(l=>l.trimEnd()).join("\n").trim();
function explain(e){const m=[["IndentationError","Einrückungsfehler: Prüfe, ob jeder Block mit 4 Leerzeichen eingerückt ist und nach einem Doppelpunkt etwas folgt."],["SyntaxError","Syntaxfehler: Python versteht eine Zeile nicht. Prüfe Doppelpunkte, Klammern und Anführungszeichen."],["NameError","Ein Name ist unbekannt. Hast du dich vertippt oder die Variable noch nicht angelegt?"],["TypeError","Typfehler: Du verbindest oder rechnest mit Werten, die nicht zusammenpassen (z. B. Text und Zahl)."],["ValueError","Der Wert hat das falsche Format, z. B. int() auf Text, der keine Zahl ist."],["ZeroDivisionError","Du teilst durch null."],["IndexError","Der Index liegt außerhalb der Liste."],["TimeLimitError","Das Programm läuft zu lange. Gibt es eine Endlosschleife?"]];
for(const [k,v] of m)if(e.includes(k))return v+"\n("+e+")";return e}
function stats(){
  const n=Object.keys(D.done).filter(k=>D.done[k]).length;
  $("#tbar").style.width=n/S.length*100+"%";
  $("#ttxt").textContent=n+" von "+S.length+" Stationen abgeschlossen";
  $("#xp").textContent=D.xp;
  $("#level").textContent=1+Math.floor(D.xp/100);
}
function awardForProgress(){
  const n=Object.keys(D.done).filter(k=>D.done[k]).length;
  const milestones=[{at:1,name:"Erster Schritt",desc:"Deine erste Station abgeschlossen."},
    {at:5,name:"Dranbleiber:in",desc:"Fünf Stationen abgeschlossen."},
    {at:10,name:"Python-Grundlagen gemeistert",desc:"Alle Stationen abgeschlossen."}];
  for(const m of milestones){
    if(n>=m.at&&!D.awards.includes(m.name)){
      D.awards.push(m.name);
      const el=document.createElement("div");
      el.className="achievement";
      el.innerHTML="<strong>Abzeichen freigeschaltet: "+esc(m.name)+"</strong><br><span class='muted'>"+esc(m.desc)+"</span>";
      $("#out").appendChild(el);
    }
  }
}
function path(){$("#path").innerHTML=S.map((s,i)=>`<button type="button" data-i="${i}" aria-current="${i==cur}"><span class="num">${String(i+1).padStart(2,"0")}</span><span>${s.t}</span><span class="st">${D.done[i]?"✓":""}</span></button>`).join("");
document.querySelectorAll("#path button").forEach(b=>b.onclick=()=>{cur=+b.dataset.i;render()})}
function render(){const s=S[cur];hn[cur]=hn[cur]||0;fails[cur]=fails[cur]||0;
$("#main").innerHTML=`<section class="card"><p class="lead">LERNSTATION ${cur+1} VON ${S.length}</p><h2>${cur+1}. ${s.t}</h2>${s.h}<div class="lesson-meta"><span class="pill">Erklären</span><span class="pill">Ausprobieren</span><span class="pill">Selbst überprüfen</span></div></section>
<section class="card"><h3>Deine Aufgabe</h3><p>${s.task}</p>
<textarea id="ed" spellcheck="false" autocapitalize="off" autocomplete="off" aria-label="Code-Editor"></textarea>
${s.usesInput ? `<label class="input-label" for="stdin">Eingaben für input() <span>(eine Eingabe pro Zeile)</span></label>
<textarea id="stdin" class="stdin" spellcheck="false" aria-label="Eingaben für input()" placeholder="Zum Beispiel:&#10;Mia&#10;14"></textarea>` : ""}
<div class="row"><button class="btn alt" id="run">Ausführen</button><button class="btn" id="chk">Prüfen</button><button class="btn alt" id="hint">Tipp anzeigen</button><button class="btn alt" id="rst">Zurücksetzen</button></div>
<p class="lbl">Tastenkürzel: Strg+Enter prüft, Tab rückt ein.</p>
<div id="out"></div></section>
<div class="row"><button class="btn alt" id="pv" ${cur==0?"disabled":""}>Zurück</button><button class="btn" id="nx" ${cur==S.length-1?"disabled":""}>Nächste Station</button></div>`;
const ed=$("#ed"),stdin=$("#stdin");
ed.value=D.code[cur]??s.start;
if(stdin){stdin.value=D.stdin?.[cur]??"";stdin.oninput=()=>{D.stdin=D.stdin||{};D.stdin[cur]=stdin.value;save()};}
ed.oninput=()=>{D.code[cur]=ed.value;save()};
ed.onkeydown=e=>{
  if(e.key==="Tab"){e.preventDefault();const p=ed.selectionStart;ed.setRangeText("    ",p,ed.selectionEnd,"end")}
  if(e.key==="Enter"&&(e.ctrlKey||e.metaKey)){e.preventDefault();check()}
};
$("#run").onclick=async()=>{
  $("#out").innerHTML='<p class="lbl">Python wird geladen und dein Programm ausgeführt …</p>';
  if(!(await ensure())){$("#out").innerHTML='<div class="t no">Der Python-Interpreter konnte nicht geladen werden. Prüfe die Internetverbindung und lade die Seite neu.</div>';return}
  const values=stdin?stdin.value.split(/\r?\n/):[];
  const r=await run(ed.value,values);
  $("#out").innerHTML=`<p class="lbl">Ausgabe deines Programms:</p><pre>${esc(r.out)||"(keine Ausgabe)"}</pre>`+(r.err?`<div class="t no">${esc(explain(r.err))}</div>`:"");
};
$("#chk").onclick=check;
$("#hint").onclick=()=>{hn[cur]=Math.min(3,hn[cur]+1);showHints()};
$("#rst").onclick=()=>{ed.value=s.start;if(stdin)stdin.value="";D.code[cur]=s.start;if(D.stdin)D.stdin[cur]="";save();$("#out").innerHTML="";const hb=$("#hbox");if(hb)hb.remove();};
$("#pv").onclick=()=>{cur--;render();scrollTo(0,0)};$("#nx").onclick=()=>{cur++;render();scrollTo(0,0)};
path();stats()}
let hbox="";
function showHints(){const s=S[cur];let h="";for(let i=0;i<hn[cur];i++)h+=`<div class="note"><b>Tipp ${i+1}:</b> <span style="white-space:pre-wrap">${esc(s.hints[i])}</span></div>`;
if(fails[cur]>=3||hn[cur]>=3)h+=`<div class="row"><button class="btn alt" id="sol">Musterlösung ansehen</button></div><div id="solbox"></div>`;
let b=$("#hbox");if(!b){b=document.createElement("div");b.id="hbox";$("#out").after(b)}b.innerHTML=h;const so=$("#sol");if(so)so.onclick=()=>{$("#solbox").innerHTML=`<pre>${esc(s.sol)}</pre>`}}
async function check(){$("#out").innerHTML='<p class="lbl">Python wird geladen und dein Code geprüft …</p>';if(!(await ensure())){$("#out").innerHTML='<div class="t no">Der Python-Interpreter konnte nicht geladen werden. Prüfe die Internetverbindung und lade die Seite neu.</div>';return}
const s=S[cur],code=$("#ed").value;let h="",pass=true;
for(const n of s.need)if(!n.re.test(code)){pass=false;h+=`<div class="t no">Hinweis zur Aufgabe: ${esc(n.msg)}</div>`}
for(const n of s.ban)if(n.re.test(code)){pass=false;h+=`<div class="t no">${esc(n.msg)}</div>`}
let first=true;
for(const [i,t] of s.tests.entries()){const r=await run(code+"\n"+(t.call||""),t.inp?[...t.inp]:[]);const exp=norm(t.out),got=norm(r.out);
const lab=t.d?t.d:(t.inp?"Eingabe: "+t.inp.join(", "):"Test "+(i+1));
if(r.err){pass=false;if(first){h+=`<div class="t no"><b>Fehler:</b> ${esc(explain(r.err))}</div>`;first=false}h+=`<div class="t no">✗ ${esc(lab)}</div>`}
else if(exp===got)h+=`<div class="t ok">✓ ${esc(lab)} stimmt</div>`;
else{pass=false;h+=`<div class="t no">✗ ${esc(lab)}<small>Erwartet: ${esc(exp)}\nBekommen: ${esc(got)||"(keine Ausgabe)"}</small></div>`}}
if(pass){
  const firstCompletion=!D.done[cur];
  h=`<div class="t ok"><b>Geschafft!</b> Alle Tests bestanden.</div>`+h;
  D.done[cur]=true;
  if(firstCompletion)D.xp+=20;
  save();path();stats();
}
else{fails[cur]++;h=`<div class="t no"><b>Noch nicht ganz.</b> Lies die Rückmeldung und verbessere deinen Code.</div>`+h}
$("#out").innerHTML=`<div class="res">${h}</div>`;
if(pass)awardForProgress();
showHints()}
$("#resetAll").onclick=()=>{
  if(confirm("Möchtest du wirklich deinen gesamten Lernstand, alle Lösungen und XP zurücksetzen?")){
    D={code:{},done:{},xp:0,awards:[]};hn={};fails={};
    try{localStorage.removeItem("pylp")}catch(e){}
    cur=0;render();
  }
};
ensure();render();
</script>
</body>
</html>
